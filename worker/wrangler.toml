name = "php2shell-audit"
main = "worker.js"
compatibility_date = "2026-10-01"

# Only the GitHub Pages site may call this Worker from a browser. For `wrangler dev`,
# override it in worker/.dev.vars (gitignored) with: ALLOWED_ORIGIN=*
# ALLOWED_TARGETS = "example.com,www.example.com" restricts scans to exact hostnames
# (include canonical redirect hosts).
[vars]
ALLOWED_ORIGIN = "https://arifulislamat.github.io"

# 10 scans per minute per visitor IP. namespace_id is any number unique in your Cloudflare account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
